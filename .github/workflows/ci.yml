name: CI

# No path filter: a required check that a filter skips never reports.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:

  # Windows too: plugin release builds run there
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Pack
      run: dotnet pack Buildingway.Build -c Release --nologo -o pack

    - name: Test
      shell: bash
      run: tests/run.sh pack 0.0.0-dev

  lint:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/workflow-lint.yml@95d5f7efba161c33e5cd0eca87d7e5499140c584 # v0.3.0
